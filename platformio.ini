; Firmware for the ESP32-S3 DevKitC (N16R8) pan/tilt laser pointer: firmware/esp32_controller.
; It needs ESP32 Arduino core 3.x (ledcAttach), which PlatformIO gets from pioarduino.
; The same code also builds in the Arduino IDE (core 3.3, board "ESP32S3 Dev Module",
; Flash Size 16MB, PSRAM OPI): copy main.cpp into a sketch folder as a .ino.
[platformio]
src_dir = firmware/esp32_controller/src
include_dir = firmware/esp32_controller/include
lib_dir = firmware/esp32_controller/lib
test_dir = firmware/esp32_controller/test
data_dir = firmware/esp32_controller/data

[env:esp32s3]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
board_upload.flash_size = 16MB
board_build.arduino.memory_type = qio_opi
